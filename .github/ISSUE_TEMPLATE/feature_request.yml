name: Feature request
description: Propose a focused improvement or protocol capability.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or operator problem, not only a proposed implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Observable outcome
      description: What should a user be able to do, and how would we verify it?
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Likely scope
      options:
        - Protocol or daemon
        - Core room behavior
        - Context or memory
        - Hiring or evaluation
        - Host adapter
        - Execution runtime bridge
        - Security or governance
        - Developer experience
        - Unsure
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Security, privacy, compatibility, and cost risks
      description: Note new data flows, permissions, spend, or host-specific assumptions.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

